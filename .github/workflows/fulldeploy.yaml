name: Retrieve Secrets, Build Docker Image, and Apply to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for var in DOCKER_USERNAME DOCKER_PASSWORD KUBE_CREDENTIALS_CLIENTID KUBE_CREDENTIALS_CLIENTSECRET KUBE_CREDENTIALS_SUBSCRIPTIONID KUBE_CREDENTIALS_TENANTID; do
            if [ -z "${{ secrets[$var] }}" ]; then
              echo "Missing secret: $var"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "One or more secrets are missing. Failing the job."
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: validate-secrets
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/interview-app:latest

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      CLIENT_ID: ${{ secrets.KUBE_CREDENTIALS_CLIENTID }}
      CLIENT_SECRET: ${{ secrets.KUBE_CREDENTIALS_CLIENTSECRET }}
      SUBSCRIPTION_ID: ${{ secrets.KUBE_CREDENTIALS_SUBSCRIPTIONID }}
      TENANT_ID: ${{ secrets.KUBE_CREDENTIALS_TENANTID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: Azure/login@v1.4.6
        with:
          creds: |
            {
              "clientId": "${{ env.CLIENT_ID }}",
              "clientSecret": "${{ env.CLIENT_SECRET }}",
              "subscriptionId": "${{ env.SUBSCRIPTION_ID }}",
              "tenantId": "${{ env.TENANT_ID }}"
            }

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.15.0'

      - name: Get AKS Credentials
        run: |
          az account set --subscription "${{ env.SUBSCRIPTION_ID }}"
          az aks get-credentials --resource-group "democluster_group" --name "democluster"

      - name: Replace Docker Username in Manifest
        run: |
          sed -i 's/<GH_ACTION.docker_username>/${{ env.DOCKER_USERNAME }}/g' ./deployments/auto-deploy.yaml
          cat ./deployments/auto-deploy.yaml

      - name: Apply Kubernetes YAMLs
        run: |
          kubectl apply -f ./deployments/config-map.yaml
          kubectl apply -f ./deployments/secrets.yaml
          kubectl apply -f ./deployments/auto-deploy.yaml

      - name: Cleanup Azure CLI Session
        run: |
          az logout
          az cache purge
          az account clear
